<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body>
	<header th:replace="~{fragments/layout :: menu}"></header>
	<main class="connexion">
		<div class="carte">
			<h1>Connexion</h1>
			<div class="alerte alerte-erreur" th:if="${param.error}">Email ou mot de passe incorrect</div>
			<div class="alerte alerte-info" th:if="${param.deconnexion}">Vous êtes déconnecté</div>
			<div th:replace="~{fragments/layout :: messages}"></div>
			<form class="formulaire" th:action="@{/login}" method="post">
				<div class="champ">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" required autofocus>
				</div>
				<div class="champ">
					<label for="motDePasse">Mot de passe</label>
					<input type="password" id="motDePasse" name="motDePasse" required>
				</div>
				<button type="submit" class="bouton">Se connecter</button>
			</form>
			<p class="aide">Étudiant sans compte ? <a th:href="@{/inscription}">Créer un compte</a></p>
		</div>
	</main>
</body>
</html>
